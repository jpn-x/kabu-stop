name: Daily Gap Analysis

on:
  schedule:
    - cron: '10 12 * * 1-5'   # 21:10 JST 平日（株データ更新の10分後）
  workflow_dispatch:
    inputs:
      backfill:
        description: '過去データを全件処理する場合は true'
        required: false
        default: 'false'

# 同じワークフローの重複実行を直列化。update.yml とはグループを分ける
# （同一グループだと待機中の run が別ワークフローの run に置き換えられ、取りこぼす恐れがあるため）
concurrency:
  group: kabu-stop-gap
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analyzer
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            python analyzer.py --backfill
          else
            python analyzer.py
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # アナライザーの出力を退避（下の git reset --hard で作業ツリーが上書きされるため）
          cp data/gap_data.csv /tmp/gap_data_ours.csv

          # 今回データ + リモート既存データを Python でマージ（コンフリクト回避）するスクリプト
          cat > /tmp/merge_gap_data.py <<'PYEOF'
          import csv, io, subprocess

          def row_key(row):
              return (row['stop_date'], row['code'], row['stop_type'])

          with open('/tmp/gap_data_ours.csv', encoding='utf-8-sig') as f:
              reader = csv.DictReader(f)
              fieldnames = reader.fieldnames
              ours = {row_key(row): row for row in reader}

          try:
              raw = subprocess.check_output(
                  ['git', 'show', 'origin/main:data/gap_data.csv']).decode('utf-8-sig')
              reader2 = csv.DictReader(io.StringIO(raw))
              remote = {row_key(row): row for row in reader2}
          except Exception:
              remote = {}

          merged = dict(remote)
          merged.update(ours)  # 今回取得データを優先
          sorted_rows = sorted(merged.values(), key=lambda x: (x['stop_date'], x['code']))

          with open('/tmp/gap_data_merged.csv', 'w', newline='', encoding='utf-8-sig') as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames or list(sorted_rows[0].keys()))
              writer.writeheader()
              writer.writerows(sorted_rows)
          print(f'マージ完了: {len(sorted_rows)} 日分')
          PYEOF

          # GitHub 側の一時エラー（remote: fatal error in commit_refs 等）や同時 push による拒否に備え、
          # 「最新取得 → マージ → commit → push」を最大4回やり直す
          for attempt in 1 2 3 4; do
            if ! git fetch origin; then
              echo "::warning::git fetch 失敗 (試行 $attempt/4)"
              sleep $((attempt * 20))
              continue
            fi

            python3 /tmp/merge_gap_data.py

            # リモートにリセットしてマージ済みデータを適用（コンフリクト不可能な状態にする）
            git reset --hard origin/main
            cp /tmp/gap_data_merged.csv data/gap_data.csv

            git add data/gap_data.csv
            if git diff --staged --quiet; then
              echo "変更なし → スキップ"
              exit 0
            fi
            git commit -m "gap data: $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M:%S')"

            if git push; then
              echo "push 成功 (試行 $attempt/4)"
              exit 0
            fi
            echo "::warning::git push 失敗 (試行 $attempt/4)。$((attempt * 20))秒後にやり直します"
            sleep $((attempt * 20))
          done

          echo "::error::git push が4回とも失敗しました"
          exit 1
