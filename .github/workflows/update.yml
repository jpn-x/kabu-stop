name: Daily Stock Data Update

on:
  schedule:
    - cron: '30 7 * * 1-5'   # 16:30 JST 平日（引け後・株探warning板を取得）
    - cron: '0 13 * * 1-5'   # 22:00 JST 平日（GitHub Actionsの実行遅延に対する保険の2回目。同日分は上書きされるだけで重複しない）
  workflow_dispatch:
    inputs:
      target_date:
        description: '取引日の確認用 (YYYY-MM-DD) — 株探ページの取引日と違えば保存しない。空欄で確認なし'
        required: false

# 同じワークフローの重複実行を直列化（cron の遅延で2本が重なっても push が競合しない）
concurrency:
  group: kabu-stop-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        id: scraper
        continue-on-error: true
        env:
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: python scraper.py

      - name: Check scraper result
        if: steps.scraper.outcome == 'failure'
        run: |
          echo "::warning::スクレイピング失敗。データ更新をスキップします。"
          exit 0

      - name: Commit and push
        if: steps.scraper.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # スクレイパーの出力を退避（下の git reset --hard で作業ツリーが上書きされるため）
          cp data/stock_data.json /tmp/stock_data_ours.json

          # 今回データ + リモート既存データを Python でマージ（コンフリクト回避）するスクリプト
          cat > /tmp/merge_stock_data.py <<'PYEOF'
          import json, subprocess
          with open('/tmp/stock_data_ours.json', encoding='utf-8') as f:
              ours = json.load(f)
          try:
              remote = json.loads(subprocess.check_output(
                  ['git', 'show', 'origin/main:data/stock_data.json']))
          except Exception:
              remote = {}
          merged = dict(remote)
          for month, days in ours.items():
              by_date = {d['date']: d for d in merged.get(month, [])}
              for day in days:
                  by_date[day['date']] = day  # 今回取得データを優先
              merged[month] = sorted(by_date.values(), key=lambda x: x['date'])
          with open('/tmp/stock_data_merged.json', 'w', encoding='utf-8') as f:
              json.dump(merged, f, ensure_ascii=False, indent=2)
          total = sum(len(v) for v in merged.values())
          print(f'マージ完了: {total} 日分')
          PYEOF

          # GitHub 側の一時エラー（remote: fatal error in commit_refs 等）や同時 push による拒否に備え、
          # 「最新取得 → マージ → commit → push」を最大4回やり直す
          for attempt in 1 2 3 4; do
            if ! git fetch origin; then
              echo "::warning::git fetch 失敗 (試行 $attempt/4)"
              sleep $((attempt * 20))
              continue
            fi

            python3 /tmp/merge_stock_data.py

            # リモートにリセットしてマージ済みデータを適用（コンフリクト不可能な状態にする）
            git reset --hard origin/main
            cp /tmp/stock_data_merged.json data/stock_data.json

            git add data/stock_data.json
            if git diff --staged --quiet; then
              echo "変更なし → スキップ"
              exit 0
            fi
            git commit -m "auto: update $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M:%S')"

            if git push; then
              echo "push 成功 (試行 $attempt/4)"
              exit 0
            fi
            echo "::warning::git push 失敗 (試行 $attempt/4)。$((attempt * 20))秒後にやり直します"
            sleep $((attempt * 20))
          done

          echo "::error::git push が4回とも失敗しました"
          exit 1
